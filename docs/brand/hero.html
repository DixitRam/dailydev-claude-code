<!doctype html>
<!-- Source of docs/hero.png. Rebuild: see docs/brand/build.sh -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --purple: #ce3df3; --bg: #0e1217; --ink: #f5f7fa; --muted: #a8b3cf; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1600px; height: 700px; overflow: hidden;
    background:
      radial-gradient(900px 420px at 50% -60px, rgba(206, 61, 243, .38), transparent 70%),
      radial-gradient(600px 300px at 90% 110%, rgba(57, 229, 140, .12), transparent 70%),
      var(--bg);
    color: var(--ink); font-family: Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding-top: 74px;
  }
  .pill {
    font: 600 15px 'JetBrains Mono', monospace; color: var(--purple);
    border: 1px solid rgba(206, 61, 243, .5); background: rgba(206, 61, 243, .1);
    padding: 7px 16px; border-radius: 999px; letter-spacing: .02em;
  }
  h1 { font-weight: 800; font-size: 68px; letter-spacing: -.035em; margin-top: 26px; text-align: center; line-height: 1.05; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #e07bff, var(--purple)); -webkit-background-clip: text; color: transparent; }
  p.sub { color: var(--muted); font-size: 23px; margin-top: 18px; }
  .win {
    margin-top: 48px; width: 1460px; border-radius: 14px; overflow: hidden;
    background: #23272b; border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(206, 61, 243, .12), 0 0 80px rgba(206, 61, 243, .18);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1b1e21; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar span.t { flex: 1; text-align: center; font: 13px 'JetBrains Mono', monospace; color: #7a8394; margin-right: 52px; }
  .win img { display: block; width: 100%; }
  .foot { position: absolute; bottom: 20px; font: 13px 'JetBrains Mono', monospace; color: #5c6577; }
</style>
</head>
<body>
  <div class="pill">/plugin install dailydev-feed</div>
  <h1>Read <em>daily.dev</em> while Claude works</h1>
  <p class="sub">Your For You feed, one post per prompt, right above the Claude Code prompt.</p>
  <div class="win">
    <div class="bar">
      <div class="dot" style="background:#ff5f57"></div>
      <div class="dot" style="background:#febc2e"></div>
      <div class="dot" style="background:#28c840"></div>
      <span class="t">~/my-project — claude</span>
    </div>
    <img src="shot.png" alt="">
  </div>
  <div class="foot">Community plugin · not affiliated with daily.dev or Anthropic</div>
</body>
</html>
